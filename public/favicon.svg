<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="kcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#kcGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Modern Monogram KC -->
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">KC</text>
  
  <!-- Subtle tech dot -->
  <circle cx="78" cy="30" r="5" fill="#10B981" />
</svg>
